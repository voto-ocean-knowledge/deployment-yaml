metadata:
  comment: 'The mission is part of the InTail project with testing the new InTail
    oxygen sensor. The InTail data is not available publically. GNSS jamming affecting
    cycles 25 (C), 26 (A, B), 27 (A, B), 28 (C), 33 (C). Read more on the issue: https://observations.voiceoftheocean.org/static/img/reports/Quality_Issue_6_gnss_jamming.pdf.'
  project: InTail
  seanav: 3.9.4 -r
  seapld: 2.24.2 -r
platform_devices:
  AD2CP:
    make_model: Nortek AD2CP
    sensor_calibration_date: '2022-03-15'
    sensor_serial_number: '103360'
  ctd:
    make_model: RBR legato CTD
    sensor_calibration_date: '2024-02-23'
    sensor_serial_number: '206523'
