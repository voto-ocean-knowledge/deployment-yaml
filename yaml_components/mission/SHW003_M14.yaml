metadata:
  comment: Mission terminated early due to an issue with the navigational pressure
    sensor leading to dropping the emergency dropweight on 2026-09-25. Glider did
    propelled dives to recovery point W-NW of the standard transect until recovery
    2026-09-27. Tridente phycocyanin channel values are suspect. The cause is under
    investigation and appears to be due to bad calibration https://observations.voiceoftheocean.org/static/img/reports/Quality_Issue_5_tridente_phycocyanin.pdf
  network: OceanGliders > BOON > Baltic Sea > SAMBA
  project: SAMBA
  seanav: 3.9.6-r
  seapld: 2.26.0-r
  site: SAMBA_02
