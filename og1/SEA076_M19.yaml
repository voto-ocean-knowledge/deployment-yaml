netcdf_variables:
  AD2CP_HEADING:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (horizontal relative to magnetic north) of measurement
      platform {heading}
    sensor: SENSOR_CURRENT_PROFILERS_103356
    source: AD2CP_HEADING
    standard_name: platform_orientation
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/HEADING/
  AD2CP_PITCH:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (pitch) of measurement platform by inclinometer
    sensor: SENSOR_CURRENT_PROFILERS_103356
    source: AD2CP_PITCH
    standard_name: platform_pitch_fore_up
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/PITCH/
  AD2CP_ROLL:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (roll angle) of measurement platform by inclinometer
    sensor: SENSOR_CURRENT_PROFILERS_103356
    source: AD2CP_ROLL
    standard_name: platform_roll_starboard_down
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/ROLL/
  BBP700:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Particle backscattering at 700 nanometers.
    observation_type: calculated
    processing: Particulate backscatter bbp calculated following methods in the Ocean
      Observatories Initiative document DATA PRODUCT SPECIFICATION FOR OPTICAL BACKSCATTER
      (RED WAVELENGTHS) Version 1-05 Document Control Number 1341-00540 2014-05-28.
      Downloaded from http://oceanobservatories.org/wp-content/uploads/2015/10/1341-00540_Data_Product_SPEC_FLUBSCT_OOI.pdf
    sensor: SENSOR_FLUOROMETERS_7485
    source: FLBBCD_BB_700_SCALED
    standard_name: acoustic_volume_backscattering_strength_in_sea_water
    units: m-1
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/BBP700/
  CDOM:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Concentration of coloured dissolved organic matter in sea water
    sensor: SENSOR_FLUOROMETERS_7485
    source: FLBBCD_CDOM_SCALED
    standard_name: concentration_of_colored_dissolved_organic_matter_in_sea_water_expressed_as_equivalent_mass_fraction_of_quinine_sulfate_dihydrate
    units: Parts per billion
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/CDOM/
  CHLA:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Chlorophyll-A
    observation_type: calculated
    sensor: SENSOR_FLUOROMETERS_7485
    source: FLBBCD_CHL_SCALED
    standard_name: concentration_of_chlorophyll_in_sea_water
    units: mg m-3
    valid_max: 50.0
    valid_min: 0.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/CHLA/
  CNDC:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Electrical conductivity of the water body by CTD
    observation_type: measured
    sensor: SENSOR_CTD_206523
    source: LEGATO_CONDUCTIVITY
    standard_name: sea_water_electrical_conductivity
    units: mS cm-1
    valid_max: 85.0
    valid_min: 0.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/CNDC/
  DEAD_RECKONING:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Dead reckoning. 1 when platform lon and lat are derived from dead reckoning.
    observation_type: measured
    sensor: SeaExplorer
    source: DeadReckoning
    units: '1'
    valid_max: 0
    valid_min: 1
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/DEAD_RECKON/
  DIVE_NUMBER:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Sequential number representing a complete descent-ascent cycle of the
      glider
    sensor: SeaExplorer
    source: fnum
    units: '1'
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/DIVE_NUMBER/
  DOXY:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Dissolved oxygen
    observation_type: calculated
    sensor: SENSOR_DISSOLVED_GAS_SENSORS_0041
    source: AROD_FT_DO
    standard_name: mole_concentration_of_dissolved_molecular_oxygen_in_sea_water
    units: mmol m-3
    valid_max: 425.0
    valid_min: 0.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/DOXY/
  FLUOCDOM:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Raw fluorescence from coloured dissolved organic matter sensor
    sensor: SENSOR_FLUOROMETERS_7485
    source: FLBBCD_CDOM_COUNT
    units: 1
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/FLUOCDOM/
  FLUOCHLA:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Raw signal (counts) of instrument output by in-situ chlorophyll fluorometer
    sensor: SENSOR_FLUOROMETERS_7485
    source: FLBBCD_CHL_COUNT
    units: '1'
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/FLUOCHLA/
  HEADING:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (horizontal relative to magnetic north) of measurement
      platform {heading} by compass
    sensor: SeaExplorer
    source: Heading
    standard_name: platform_orientation
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/HEADING/
  LATITUDE:
    _FillValue: -9999.9
    conversion: nmea2deg
    interpolation_methodology: ''
    long_name: latitude of each measurement and GPS location
    sensor: SeaExplorer
    source: Lat
    standard_name: latitude
    units: degree_north
    valid_max: 90.0
    valid_min: -90.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/LAT/
  LONGITUDE:
    _FillValue: -9999.9
    conversion: nmea2deg
    interpolation_methodology: ''
    long_name: longitude of each measurement and GPS location
    sensor: SeaExplorer
    source: Lon
    standard_name: longitude
    units: degree_east
    valid_max: 180.0
    valid_min: -180.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/LON/
  NAV_RESOURCE:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Navigation state of SeaExplorer glider
    sensor: SeaExplorer
    source: NAV_RESOURCE
    units: '1'
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/NAV_RESOURCE/
  PITCH:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (pitch) of measurement platform by inclinometer
    sensor: SeaExplorer
    source: Pitch
    standard_name: platform_pitch_fore_up
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/PITCH/
  PRES:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Pressure (spatial coordinate) exerted by the water body by profiling
      pressure sensor and correction to read zero at sea level
    observation_type: measured
    positive: down
    reference_datum: sea-surface
    sensor: SENSOR_CTD_206523
    source: LEGATO_PRESSURE
    standard_name: sea_water_pressure
    units: dbar
    valid_max: 2000.0
    valid_min: 0.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/PRES/
  RBBP700:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Raw signal from backscattering sensor at 700 nanometers
    observation_type: observed
    sensor: SENSOR_FLUOROMETERS_7485
    source: FLBBCD_BB_700_COUNT
    units: '1'
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/RBBP700/
  ROLL:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (roll angle) of measurement platform by inclinometer
    sensor: SeaExplorer
    source: Roll
    standard_name: platform_roll_starboard_down
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/ROLL/
  TEMP:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Temperature of the water body by CTD
    observation_type: measured
    sensor: SENSOR_CTD_206523
    source: LEGATO_TEMPERATURE
    standard_name: sea_water_temperature
    units: Degrees Celsius
    valid_max: 42.0
    valid_min: -5.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/TEMP/
  TEMPDOXY:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Sea temperature from oxygen sensor ITS-90 scale
    observation_type: measured
    sensor: SENSOR_DISSOLVED_GAS_SENSORS_0041
    source: AROD_FT_TEMP
    standard_name: sea_water_temperature
    units: Degrees Celsius
    valid_max: 42.0
    valid_min: -5.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/TEMPDOXY/
  TIME:
    _FillValue: 1
    calendar: gregorian
    interpolation_methodology: ''
    long_name: Time elapsed since 1970-01-01T00:00:00Z
    sensor: SeaExplorer
    source: time
    standard_name: time
    units: since 1970-01-01T00:00:00Z
    valid_max: 4000000000
    valid_min: 1000000000
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/TIME/
  keep_variables:
  - AD2CP_PITCH
  - conductivity
  - RBBP700
  - TEMPDOXY
  timebase:
    source: NAV_LATITUDE
qc:
  backscatter_raw:
    comment: Water was leaking through the FLBBCD sensors so data may be incorrect,
      further controls are recommended.
    value: 3
  backscatter_scaled:
    comment: Water was leaking through the FLBBCD sensors so data may be incorrect,
      further controls are recommended.
    value: 3
  cdom:
    comment: Water was leaking through the FLBBCD sensors so data may be incorrect,
      further controls are recommended.
    value: 3
  cdom_raw:
    comment: Water was leaking through the FLBBCD sensors so data may be incorrect,
      further controls are recommended.
    value: 3
  chlorophyll:
    comment: Water was leaking through the FLBBCD sensors so data may be incorrect,
      further controls are recommended.
    value: 3
  chlorophyll_raw:
    comment: Water was leaking through the FLBBCD sensors so data may be incorrect,
      further controls are recommended.
    value: 3
  oxygen_concentration:
    comment: Following issues with the oxygen sensor, a 2-point calibration has been
      performed on date {2023-09-04}. The values at 0 and 100 % saturation are accurate.
      Absolute Values between these two extremes may be inaccurate. The relative variability
      is confirmed to be valid and no temporal drift occurs. During tests values that
      can be outside the manufacturer acceptance range have been observed when compared
      to the output from a reference sensor. This issue is particularly evident around
      100μmol/l. More information on the history and updates regarding this issue
      (https://observations.voiceoftheocean.org/data/updates).
    value: 4
