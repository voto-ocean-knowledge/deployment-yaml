metadata:
  Conventions: CF-1.10, OG-1.0, Unidata Dataset Discovery v1.0
  acknowledgement: This study used data collected and made freely available by Voice
    of the Ocean Foundation (https://voiceoftheocean.org) accessed from https://erddap.observations.voiceoftheocean.org/erddap/index.html
  agency: Voice of the Ocean
  agency_role: contact point
  agency_role_vocabulary: http://vocab.nerc.ac.uk/collection/C86/current/
  comment: Part of the TurboMix mission, deployed with Legato Tridente and a MicroRider-1000-G
    sensor. MR1000G was set to sample every 2nd dive downcast + up to 40 m upcast,
    although it sampled at all times due to a conflict in the softwares of the glider
    payload and MicroRider sensor which lead to an increased battery consumption.
    Part-time loitering was performed during the last part of the mission to save
    battery.
  contributing_institutions: Voice of the Ocean Foundation
  contributing_institutions_role: Operator
  contributing_institutions_role_vocabulary: http://vocab.nerc.ac.uk/collection/W08/current/
