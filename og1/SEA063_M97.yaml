netcdf_variables:
  AD2CP_HEADING:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (horizontal relative to magnetic north) of measurement
      platform {heading}
    sensor: SENSOR_CURRENT_PROFILERS_101589
    source: AD2CP_HEADING
    standard_name: platform_orientation
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/HEADING/
  AD2CP_PITCH:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (pitch) of measurement platform by inclinometer
    sensor: SENSOR_CURRENT_PROFILERS_101589
    source: AD2CP_PITCH
    standard_name: platform_pitch_fore_up
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/PITCH/
  AD2CP_ROLL:
    comment: measured by AD2CP
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (roll angle) of measurement platform by inclinometer
    sensor: SENSOR_CURRENT_PROFILERS_101589
    source: AD2CP_ROLL
    standard_name: platform_roll_starboard_down
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/ROLL/
  CNDC:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Electrical conductivity of the water body by CTD
    observation_type: measured
    sensor: SENSOR_CTD_206612
    source: LEGATO_CONDUCTIVITY
    standard_name: sea_water_electrical_conductivity
    units: mS cm-1
    valid_max: 85.0
    valid_min: 0.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/CNDC/
  DEAD_RECKONING:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Dead reckoning. 1 when platform lon and lat are derived from dead reckoning.
    observation_type: measured
    sensor: SeaExplorer
    source: DeadReckoning
    units: '1'
    valid_max: 0
    valid_min: 1
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/DEAD_RECKON/
  DIVE_NUMBER:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Sequential number representing a complete descent-ascent cycle of the
      glider
    sensor: SeaExplorer
    source: fnum
    units: '1'
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/DIVE_NUMBER/
  HEADING:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (horizontal relative to magnetic north) of measurement
      platform {heading} by compass
    sensor: SeaExplorer
    source: Heading
    standard_name: platform_orientation
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/HEADING/
  LATITUDE:
    _FillValue: -9999.9
    conversion: nmea2deg
    interpolation_methodology: ''
    long_name: latitude of each measurement and GPS location
    sensor: SeaExplorer
    source: NAV_LATITUDE
    standard_name: latitude
    units: degree_north
    valid_max: 90.0
    valid_min: -90.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/LAT/
  LONGITUDE:
    _FillValue: -9999.9
    conversion: nmea2deg
    interpolation_methodology: ''
    long_name: longitude of each measurement and GPS location
    sensor: SeaExplorer
    source: NAV_LONGITUDE
    standard_name: longitude
    units: degree_east
    valid_max: 180.0
    valid_min: -180.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/LON/
  NAV_RESOURCE:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Navigation state of SeaExplorer glider
    sensor: SeaExplorer
    source: NAV_RESOURCE
    units: '1'
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/NAV_RESOURCE/
  PITCH:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (pitch) of measurement platform by inclinometer
    sensor: SeaExplorer
    source: Pitch
    standard_name: platform_pitch_fore_up
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/PITCH/
  PRES:
    comment: ctd pressure sensor
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Pressure (spatial coordinate) exerted by the water body by profiling
      pressure sensor and correction to read zero at sea level
    observation_type: measured
    positive: down
    reference_datum: sea-surface
    sensor: SENSOR_CTD_206612
    source: LEGATO_PRESSURE
    standard_name: sea_water_pressure
    units: dbar
    valid_max: 2000.0
    valid_min: 0.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/PRES/
  ROLL:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Orientation (roll angle) of measurement platform by inclinometer
    sensor: SeaExplorer
    source: Roll
    standard_name: platform_roll_starboard_down
    units: Degrees
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/ROLL/
  TEMP:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: Temperature of the water body by CTD
    observation_type: measured
    sensor: SENSOR_CTD_206612
    source: LEGATO_TEMPERATURE
    standard_name: sea_water_temperature
    units: Degrees Celsius
    valid_max: 42.0
    valid_min: -5.0
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/TEMP/
  TIME:
    _FillValue: 1
    calendar: gregorian
    interpolation_methodology: ''
    long_name: Time elapsed since 1970-01-01T00:00:00Z
    sensor: SeaExplorer
    source: time
    standard_name: time
    units: since 1970-01-01T00:00:00Z
    valid_max: 4000000000
    valid_min: 1000000000
    vocabulary: http://vocab.nerc.ac.uk/collection/OG1/current/TIME/
  ad2cp_beam1_cell_number1:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider beam 1 measure from AD2CP in cell 1
    processing_comment: Legacy variable not yet converted to OG1
    source: AD2CP_V1_CN1
    units: m s-1
  ad2cp_beam2_cell_number1:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider beam 2 measure from AD2CP in cell 1
    processing_comment: Legacy variable not yet converted to OG1
    source: AD2CP_V2_CN1
    units: m s-1
  ad2cp_beam3_cell_number1:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider beam 3 measure from AD2CP in cell 1
    processing_comment: Legacy variable not yet converted to OG1
    source: AD2CP_V3_CN1
    units: m s-1
  ad2cp_beam4_cell_number1:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider beam 4 measure from AD2CP in cell 1
    processing_comment: Legacy variable not yet converted to OG1
    source: AD2CP_V4_CN1
    units: m s-1
  ad2cp_pressure:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider pressure from AD2CP
    processing_comment: Legacy variable not yet converted to OG1
    source: AD2CP_PRESSURE
    units: dbar
  angular_cmd:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider angular command
    processing_comment: Legacy variable not yet converted to OG1
    source: AngCmd
    units: degrees
  angular_pos:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider angular position
    processing_comment: Legacy variable not yet converted to OG1
    source: AngPos
    units: degrees
  ballast_cmd:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider ballast command
    processing_comment: Legacy variable not yet converted to OG1
    source: BallastCmd
    units: ml
  ballast_pos:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider ballast position
    processing_comment: Legacy variable not yet converted to OG1
    source: BallastPos
    units: ml
  declination:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: declination
    processing_comment: Legacy variable not yet converted to OG1
    source: Declination
    units: degrees
  desired_heading:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider desired heading angle
    processing_comment: Legacy variable not yet converted to OG1
    source: DesiredH
    units: degrees
  internal_pressure:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: internal pressure
    processing_comment: Legacy variable not yet converted to OG1
    source: Pa
    units: Pa
  internal_temperature:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: internal temperature
    processing_comment: Legacy variable not yet converted to OG1
    source: Temperature
    units: Celsius
  keep_variables:
  - AD2CP_PITCH
  - conductivity
  linear_cmd:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider linear command
    processing_comment: Legacy variable not yet converted to OG1
    source: LinCmd
    units: cm
  linear_pos:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider linear position
    processing_comment: Legacy variable not yet converted to OG1
    source: LinPos
    units: cm
  salinity:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: water salinity
    processing_comment: Legacy variable not yet converted to OG1
    source: LEGATO_SALINITY
    units: PSU
  security_level:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: security level
    processing_comment: Legacy variable not yet converted to OG1
    source: SecurityLevel
    units: None
  timebase:
    source: NAV_LATITUDE
  voltage:
    coordinates: TIME, LONGITUDE, LATITUDE, DEPTH
    long_name: glider voltage
    processing_comment: Legacy variable not yet converted to OG1
    source: Voltage
    units: V
